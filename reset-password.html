<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Vercel Bank</title><style>body{font-family:Arial,sans-serif;background:#faf9f7;color:#222;margin:0}.box{max-width:430px;margin:70px auto;background:white;padding:30px;border:1px solid #e8e4de}h1{color:#791c2b}label{display:block;margin:18px 0 7px;font-weight:bold;font-size:13px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc}button{margin-top:20px;width:100%;padding:14px;background:#791c2b;color:white;border:0;font-weight:bold}#message{margin-top:16px;line-height:1.5;font-size:13px}</style></head><body><main class="box"><h1>Choose a new password</h1><p>Enter and confirm your new password below.</p><form id="form"><label for="password">New password</label><input id="password" type="password" minlength="10" autocomplete="new-password" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="10" autocomplete="new-password" required><button id="submit">Update password</button></form><div id="message" role="status"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="supabase-client.js"></script><script>document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const p=document.getElementById("password").value,c=document.getElementById("confirm").value,m=document.getElementById("message"),b=document.getElementById("submit");if(p.length<10||p!==c){m.textContent=p!==c?"Passwords do not match.":"Use at least 10 characters.";return}b.disabled=true;b.textContent="Updating…";const {error}=await window.vercelBankClient.auth.updateUser({password:p});if(error){m.textContent=error.message;b.disabled=false;b.textContent="Update password"}else{m.textContent="Your password has been updated. You can now log in.";document.getElementById("form").hidden=true}});</script></body></html>
