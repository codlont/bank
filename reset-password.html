<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Vercel Bank</title><style>body{font-family:Arial,sans-serif;background:#faf9f7;color:#222;margin:0}.box{max-width:430px;margin:45px auto;background:white;padding:30px;border:1px solid #e8e4de}h1{color:#791c2b}label{display:block;margin:18px 0 7px;font-weight:bold;font-size:13px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc}button{margin-top:20px;width:100%;padding:14px;background:#791c2b;color:white;border:0;font-weight:bold}#message{margin-top:16px;line-height:1.5;font-size:13px} .simple-nav{height:70px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6%;box-shadow:0 2px 12px #00000009}.simple-nav a{color:#791c2b;text-decoration:none;font-weight:bold;margin-left:12px;font-size:13px}</style></head><body><header class="simple-nav"><a href="index.html">VERCEL BANK</a><div><a href="sign-in.html">Log in</a><a href="create-account.html">Create account</a></div></header><main class="box"><h1>Choose a new password</h1><p>Enter and confirm your new password below.</p><form id="form"><label for="password">New password</label><input id="password" type="password" minlength="10" autocomplete="new-password" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="10" autocomplete="new-password" required><button id="submit">Update password</button></form><div id="message" role="status"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="supabase-client.js"></script><script>document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const p=document.getElementById("password").value,c=document.getElementById("confirm").value,m=document.getElementById("message"),b=document.getElementById("submit");if(p.length<10||p!==c){m.textContent=p!==c?"Passwords do not match.":"Use at least 10 characters.";return}b.disabled=true;b.textContent="Updating…";const {error}=await window.vercelBankClient.auth.updateUser({password:p});if(error){m.textContent=error.message;b.disabled=false;b.textContent="Update password"}else{m.textContent="Your password has been updated. You can now log in.";document.getElementById("form").hidden=true}});</script>
<script>
(function removeTopLaunchNotice(){
 const pattern=/(pre.?launch|relaunch|launching soon|coming soon)/i;
 function clean(){
  const nodes=[...document.body.querySelectorAll('body *')].reverse();
  for(const el of nodes){
   if(!el.isConnected || el.matches('script,style,header,nav,main,footer')) continue;
   const rect=el.getBoundingClientRect();
   if(rect.top>180 || rect.height>180 || rect.height===0) continue;
   const text=(el.innerText||el.textContent||'').trim();
   if(text.length>0 && text.length<600 && pattern.test(text)){
    const childMatch=[...el.children].some(child=>pattern.test((child.innerText||child.textContent||'').trim()));
    if(!childMatch) el.remove();
   }
  }
 }
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',clean); else clean();
 new MutationObserver(clean).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
</body></html>
